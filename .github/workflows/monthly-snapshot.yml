name: Monthly DB snapshot

# Runs monthly to refresh the insider-signals SQLite DB and publish it as a
# GitHub Release asset. The MCPB install script pulls the latest release
# tagged `data-YYYY-MM`.
#
# Default mode seeds from the previous month's release (prices, splits, share
# counts) and runs refresh.py. refresh.py always rebuilds the insider
# transactions table from scratch: SEC's quarterly bulk Form 3/4/5 files
# (~10 min), plus the filings newer than those files, fetched one by one.
#
# Timing: SEC publishes each quarter's bulk file about a week after the
# quarter ends (7 Jan, 7 Apr, 9 Jul 2026; one came six weeks late). Filings
# newer than the last bulk file are fetched one at a time, about 20 minutes
# per 10 days of filings. Running on the 1st meant fetching a whole quarter
# that way (2.5+ hours), which ran out of time.
# On the 10th, the newest bulk file is 10, 40 or 70 days old depending on
# the month: about 20 minutes, 1.3 hours or 2.3 hours of fetching.
#
# `force_full_rebuild: true` on manual dispatch starts from an empty DB
# instead of the previous release, for when the prior DB is corrupted.
#
# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃ SECURITY WARNING: Do NOT add a pull_request trigger to this workflow.  ┃
# ┃                                                                         ┃
# ┃ This workflow runs on a self-hosted runner (the owner's machine).      ┃
# ┃ A pull_request trigger would allow any fork to execute arbitrary code  ┃
# ┃ on that machine. Only schedule and workflow_dispatch are safe here.    ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

on:
  schedule:
    # 06:00 UTC on the 10th of every month (see Timing above).
    - cron: "0 6 10 * *"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Optional suffix appended to the release tag (e.g. -hotfix)."
        required: false
        default: ""
      force_full_rebuild:
        description: "Rebuild the DB from scratch instead of incremental refresh."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Prevent concurrent runs on the same runner (self-hosted has single instance).
# Queue mode: new runs wait rather than cancelling in-progress runs, which is
# safer for workflows that mutate a shared database.
concurrency:
  group: monthly-snapshot-runner
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: [self-hosted, insider-signals]
    timeout-minutes: 480  # self-hosted runner; refresh alone can take 3h
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONUNBUFFERED: "1"
    # Step ordering enforces data dependencies:
    #   seed/refresh (insider trades, tickers, share counts) -> benchmark ETFs
    #   -> prices (needs correct tickers) -> splits -> market cap -> scoring
    #   -> historical backtest (needs prices + benchmarks) -> frozen export (needs hit rates)
    #   -> VALIDATE -> compress -> publish
    # NOTE: Market cap computation happens early (Phase 2.7 in refresh.py), but prices are
    #       refreshed later. If this ordering causes stale market caps, Phase 2.7 needs to move.
    steps:
      - uses: actions/checkout@v4

      - name: Hold PreventSystemSleep assertion (prevent clamshell sleep)
        run: |
          # caffeinate -s prevents clamshell sleep when on AC power.
          # Refuse to run on battery: the assertion is silently ignored there,
          # and we would discover the lid-close failure an hour later.

          POWER_STATUS=$(pmset -g ps | head -1)
          if echo "$POWER_STATUS" | grep -q "Battery Power"; then
            echo "❌ ERROR: Machine is on battery power."
            echo "   caffeinate -s only prevents clamshell sleep on AC power."
            echo "   Plug in AC adapter and re-trigger the workflow."
            exit 1
          fi

          echo "✓ On AC power: $POWER_STATUS"

          # Start caffeinate in the background, bounded by -t slightly above the
          # 360-minute job timeout. This is the safety net: a cancelled job may
          # not run cleanup at all, and without the bound a leaked assertion
          # would keep the Mac awake indefinitely.
          # 360 minutes = 21600 seconds; use 22000 to stay above the timeout.
          caffeinate -s -t 22000 &
          CAFFEINATE_PID=$!

          echo "Started caffeinate (PID $CAFFEINATE_PID, timeout 22000s)"
          echo "CAFFEINATE_PID=$CAFFEINATE_PID" >> "$GITHUB_ENV"

      - name: Set up Python
        run: |
          # actions/setup-python hardcodes /Users/runner/hostedtoolcache on macOS
          # and fails with "Permission denied" on self-hosted runners that don't
          # have that path. Build an isolated venv from the system interpreter instead.

          # Prefer Python 3.12, fall back to python3
          if command -v python3.12 >/dev/null 2>&1; then
            PY=python3.12
          elif command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            echo "ERROR: python3 not found on PATH"
            exit 1
          fi

          echo "Found: $PY"
          "$PY" --version

          # Verify version is 3.11+
          VERSION_CHECK=$("$PY" -c 'import sys; print(1 if sys.version_info >= (3,11) else 0)' 2>/dev/null || echo 0)
          if [ "$VERSION_CHECK" != "1" ]; then
            FOUND_VERSION=$("$PY" -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null || echo "unknown")
            echo "ERROR: Python version too old (found $FOUND_VERSION, need >=3.11)"
            exit 1
          fi

          # Create isolated venv in RUNNER_TEMP (cleaned between runs)
          "$PY" -m venv "$RUNNER_TEMP/venv"

          # Add to PATH for all subsequent steps. This ensures both `python` and `python3`
          # resolve to the venv (venvs include both symlinks by default).
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ── Path A: incremental (default) ──
      - name: Seed DB from previous release (incremental mode)
        if: ${{ github.event.inputs.force_full_rebuild != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data packages/tracker/db
          # Find the latest release whose tag starts with data-
          PREV_TAG=$(gh release list --repo ${{ github.repository }} --json tagName --jq '[.[] | .tagName | select(startswith("data-"))][0]')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous data-* release found; falling back to fresh init"
            python packages/tracker/db/init_db.py
            cp packages/tracker/db/insider_signals.db data/insider_signals.db
          else
            echo "Seeding from previous release: $PREV_TAG"
            gh release download "$PREV_TAG" --repo ${{ github.repository }} --pattern "insider_signals.db.xz" --dir data/
            xz -d data/insider_signals.db.xz
            # tracker code reads from packages/tracker/db/; mirror it there
            cp data/insider_signals.db packages/tracker/db/insider_signals.db
            echo "Seeded DB size:"
            ls -lh data/insider_signals.db packages/tracker/db/insider_signals.db
          fi

      - name: Run refresh (20 min to ~2.5h, see Timing above)
        if: ${{ github.event.inputs.force_full_rebuild != 'true' }}
        timeout-minutes: 240
        run: |
          cd packages/tracker
          python refresh.py --expanded --skip-sectors

      # ── Path B: full rebuild (only if force_full_rebuild=true) ──
      - name: Initialize empty DB schema (full rebuild mode)
        if: ${{ github.event.inputs.force_full_rebuild == 'true' }}
        run: |
          mkdir -p data packages/tracker/db
          python packages/tracker/db/init_db.py
          cp packages/tracker/db/insider_signals.db data/insider_signals.db

      - name: Run full rebuild from SEC bulk files
        if: ${{ github.event.inputs.force_full_rebuild == 'true' }}
        timeout-minutes: 240
        run: |
          cd packages/tracker
          python refresh.py --expanded --skip-sectors

      # ── Common: prices, shares, backtest, sync, compress, publish ──
      - name: Fetch benchmark ETF prices
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/fetch_benchmark_etfs.py

      - name: Backfill pre-2021 prices
        timeout-minutes: 60
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/backfill_prices.py

      - name: Backfill splits
        timeout-minutes: 45
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/backfill_splits.py --write

      - name: Recompute market caps
        timeout-minutes: 30
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/recompute_market_caps.py --unverified-only --write

      # Required: without it, prices typed wrong in filings (totals in the
      # price field) reach users as huge purchases or sales.
      - name: Cleanup corrupt prices
        timeout-minutes: 10
        run: |
          cd packages/tracker
          python scripts/cleanup_corrupt_prices.py --write

      # refresh.py scored the scanner before the cleanup above; score again so
      # latest_signals.csv matches the cleaned prices.
      - name: Re-score signals after price cleanup
        timeout-minutes: 30
        run: |
          cd packages/tracker
          python scripts/rescore_signals.py

      # Required: historical_clusters.csv drives the hit-rate part of the score.
      - name: Run historical backtest
        timeout-minutes: 20
        run: |
          cd packages/tracker
          python backtest/historical_backtest.py

      - name: Train base-rate model
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd packages/tracker
          # Pipefail stops tee from masking a non-zero exit so the step is marked failed and visible.
          # Non-fatal by design; publication is blocked downstream by the CRITICAL base_rates.tables_exist contract check.
          set -o pipefail
          python scoring/train_base_rates.py | tee output/training.log

      # Required: if this fails, the contract check still passes on the old
      # snapshot committed in packages/valuation/data/, and users would get
      # stale insider data without anyone noticing.
      - name: Export frozen insider snapshot
        timeout-minutes: 30
        run: |
          cd packages/tracker
          python scripts/export_frozen_insider.py

      - name: Validate data contract
        timeout-minutes: 5
        # Check the files this run produced, not the old snapshot committed in
        # packages/valuation/data/ that the checks fall back to.
        env:
          INSIDER_FROZEN_DATA: ${{ github.workspace }}/packages/tracker/output/insider_frozen.json.gz
          HISTORICAL_CSV_PATH: ${{ github.workspace }}/packages/tracker/output/historical_clusters.csv
        run: |
          cd packages/tracker
          mkdir -p validation_reports
          # Pipefail ensures tee does not mask the validator's exit code.
          # Without this, a CRITICAL failure would exit 1 but the step would
          # succeed (tee always returns 0), and publication would proceed.
          set -o pipefail
          python -m pipeline.validate \
            --json-report validation_reports/validation.json \
            --verbose | tee validation_reports/validation.txt

      # Re-reads a random sample of stored trades from the original SEC filings,
      # checks a sample of SEC's filing index is fully loaded, and checks the
      # rules that must always hold (no trade stored twice, no company listed
      # as its own insider). Any failure stops the release.
      - name: Correctness audit against SEC (blocks publishing)
        timeout-minutes: 60
        run: |
          cd packages/tracker
          set -o pipefail
          python pipeline/correctness_audit.py \
            --db db/insider_signals.db \
            --json validation_reports/correctness.json | tee validation_reports/correctness.txt

      - name: Upload validation report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: packages/tracker/validation_reports/
          retention-days: 90

      - name: Sync data/ from tracker output
        run: |
          cp packages/tracker/db/insider_signals.db data/insider_signals.db
          # Every file users read must come from this run. A missing one stops
          # the release here, before anything is published.
          for f in latest_signals.csv historical_clusters.csv insider_frozen.json.gz; do
            if [ ! -s "packages/tracker/output/$f" ]; then
              echo "::error::$f was not produced by this run"
              exit 1
            fi
            cp "packages/tracker/output/$f" "data/$f"
          done
          if [ -f packages/tracker/validation_reports/validation.json ]; then
            cp packages/tracker/validation_reports/validation.json data/validation.json
          fi
          if [ -f packages/tracker/validation_reports/validation.txt ]; then
            cp packages/tracker/validation_reports/validation.txt data/validation.txt
          fi
          cp packages/tracker/validation_reports/correctness.txt data/correctness.txt

      - name: Compress DB
        run: |
          # xz -9 -T0 (multi-threaded) takes ~1 min for ~1.9 GB → ~194 MB.
          xz -9 -T0 -k data/insider_signals.db
          ls -lh data/

      - name: Generate SHA256SUMS
        run: |
          cd data
          # Generate checksums for all release assets (basenames only, two spaces between hash and filename)
          sha256sum insider_signals.db.xz latest_signals.csv > SHA256SUMS
          if [ -f historical_clusters.csv ]; then
            sha256sum historical_clusters.csv >> SHA256SUMS
          fi
          if [ -f insider_frozen.json.gz ]; then
            sha256sum insider_frozen.json.gz >> SHA256SUMS
          fi
          if [ -f validation.json ]; then
            sha256sum validation.json >> SHA256SUMS
          fi
          if [ -f validation.txt ]; then
            sha256sum validation.txt >> SHA256SUMS
          fi
          sha256sum correctness.txt >> SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Compute release tag
        id: tag
        run: |
          SUFFIX="${{ github.event.inputs.tag_suffix }}"
          echo "tag=data-$(date -u +%Y-%m)${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="incremental"
          if [ "${{ github.event.inputs.force_full_rebuild }}" = "true" ]; then
            MODE="full rebuild"
          fi

          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="Monthly DB snapshot — $TAG"
          NOTES="Pre-built insider-transactions + shares-outstanding SQLite DB plus the latest signal scanner CSV, historical hit rate clusters, frozen insider snapshot, and validation report. Generated automatically by the monthly-snapshot workflow ($MODE mode). SHA256SUMS provided for integrity verification."

          # Step 1: ensure the release exists with no assets
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            echo "Creating release $TAG (no assets yet)"
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          # Step 2: upload assets individually with retries
          # Helper function: retry up to N times with a short sleep
          upload_with_retry() {
            local FILE="$1"
            local MAX_ATTEMPTS="$2"
            local ATTEMPT=1

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              if [ ! -f "$FILE" ]; then
                echo "⚠️  $FILE does not exist, skipping"
                return 1
              fi
              if [ ! -s "$FILE" ]; then
                echo "⚠️  $FILE is zero bytes (GitHub rejects), skipping"
                return 1
              fi

              echo "Uploading $FILE (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
              if gh release upload "$TAG" "$FILE" \
                --repo ${{ github.repository }} \
                --clobber; then
                echo "✓ $FILE uploaded"
                return 0
              else
                echo "✗ Upload failed for $FILE"
                if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                  sleep 3
                fi
              fi
              ATTEMPT=$((ATTEMPT + 1))
            done

            return 1
          }

          # Critical assets: must succeed or fail the step
          CRITICAL_OK=true
          echo "=== Uploading critical assets ==="
          if ! upload_with_retry "data/insider_signals.db.xz" 3; then
            echo "❌ CRITICAL: insider_signals.db.xz upload failed"
            CRITICAL_OK=false
          fi
          if ! upload_with_retry "data/SHA256SUMS" 3; then
            echo "❌ CRITICAL: SHA256SUMS upload failed"
            CRITICAL_OK=false
          fi

          # Best-effort assets: retry once, log and continue on failure
          echo "=== Uploading best-effort assets ==="
          upload_with_retry "data/latest_signals.csv" 2 || echo "⚠️  latest_signals.csv skipped"
          upload_with_retry "data/historical_clusters.csv" 2 || echo "⚠️  historical_clusters.csv skipped"
          upload_with_retry "data/insider_frozen.json.gz" 2 || echo "⚠️  insider_frozen.json.gz skipped"
          upload_with_retry "data/validation.json" 2 || echo "⚠️  validation.json skipped"
          upload_with_retry "data/validation.txt" 2 || echo "⚠️  validation.txt skipped"
          upload_with_retry "data/correctness.txt" 2 || echo "⚠️  correctness.txt skipped"

          # Step 3: verify critical assets and fail if missing
          if [ "$CRITICAL_OK" = false ]; then
            echo ""
            echo "❌ Publication failed: one or more critical assets could not be uploaded"
            exit 1
          fi

          echo ""
          echo "✅ Publication complete for $TAG"

      - name: Cleanup caffeinate process
        if: always()
        run: |
          # Kill the caffeinate process started at the beginning of the job.
          # Tolerate it already being gone (either the -t timeout fired or
          # the process was already cleaned up for some other reason).
          if [ -n "$CAFFEINATE_PID" ]; then
            if kill "$CAFFEINATE_PID" 2>/dev/null; then
              echo "Stopped caffeinate (PID $CAFFEINATE_PID)"
            else
              echo "caffeinate (PID $CAFFEINATE_PID) already stopped"
            fi
          else
            echo "No CAFFEINATE_PID recorded (may have failed to start)"
          fi
