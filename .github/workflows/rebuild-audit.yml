name: Rebuild Audit

# Quarterly audit to verify the full rebuild path and detect incremental drift.
#
# This workflow:
#   1. Rebuilds the database from an empty schema, the same way the monthly
#      snapshot's full rebuild does (refresh.py from SEC's bulk files)
#   2. Checks the rebuilt data against SEC itself (pipeline/correctness_audit.py):
#      fixed rules, a random sample of trades re-read from the original filings,
#      a random sample of SEC's filing index looked up in the database, known
#      past mistakes, and share counts against company reports
#   3. Downloads the current published release and compares the two, to show
#      what changed since the last release
#   4. Validates the rebuilt DB against the data contract
#   5. Publishes all reports as workflow artifacts
#
# The correctness audit is the one that says whether the data is right; the
# comparison only says how far it moved since the last release.
#
# Timing: SEC publishes each quarter's bulk file about a week after the
# quarter ends (7 Jan, 7 Apr, 9 Jul 2026; one came six weeks late). Filings
# newer than the last bulk file are fetched one at a time, about 20 minutes
# per 10 days of filings. Running on the 1st meant fetching a whole quarter
# that way (2.5+ hours), which ran out of time.
# On the 10th of a quarter's first month the tail is about 10 days, so the
# rebuild takes well under an hour; the step allows for SEC publishing late.
#
# CRITICAL: This workflow DOES NOT publish a release. It is an audit only.
# If suspicious differences are found, the workflow fails loudly for human review.

on:
  schedule:
    # 06:00 UTC on the 10th of Jan, Apr, Jul, Oct (see Timing above)
    - cron: "0 6 10 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      skip_backfills:
        description: "Skip the slow backfill steps (for testing the workflow)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  rebuild-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub-hosted maximum; rebuild normally under 1h
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ── Full rebuild from source ──
      - name: Initialize empty DB schema
        run: |
          mkdir -p audit packages/tracker/db
          python packages/tracker/db/init_db.py
          cp packages/tracker/db/insider_signals.db audit/rebuilt.db
          echo "Initialized empty schema:"
          ls -lh audit/rebuilt.db

      - name: Run full rebuild from SEC bulk files
        timeout-minutes: 180
        run: |
          cd packages/tracker
          python refresh.py --expanded --skip-sectors
          cp db/insider_signals.db ../../audit/rebuilt.db
          echo "Full rebuild complete:"
          ls -lh ../../audit/rebuilt.db

      # ── Optional backfills (matching monthly-snapshot.yml pattern) ──
      - name: Backfill pre-2021 prices
        if: ${{ github.event.inputs.skip_backfills != 'true' }}
        timeout-minutes: 60
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/backfill_prices.py

      - name: Fetch benchmark ETF prices
        if: ${{ github.event.inputs.skip_backfills != 'true' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/fetch_benchmark_etfs.py

      - name: Recompute market caps
        if: ${{ github.event.inputs.skip_backfills != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/recompute_market_caps.py --write

      - name: Run historical backtest
        if: ${{ github.event.inputs.skip_backfills != 'true' }}
        timeout-minutes: 30
        continue-on-error: true
        run: |
          cd packages/tracker
          python backtest/historical_backtest.py

      - name: Export frozen insider snapshot
        if: ${{ github.event.inputs.skip_backfills != 'true' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/export_frozen_insider.py

      # Sync rebuilt DB back to audit/
      - name: Sync rebuilt DB to audit directory
        run: |
          cp packages/tracker/db/insider_signals.db audit/rebuilt.db
          echo "Rebuilt DB after backfills:"
          ls -lh audit/

      # ── Check the rebuilt data against SEC ──
      - name: Correctness audit
        id: correctness
        timeout-minutes: 30
        continue-on-error: true
        run: |
          mkdir -p audit/reports
          cd packages/tracker
          set +e
          python pipeline/correctness_audit.py \
            --db ../../audit/rebuilt.db \
            --json ../../audit/reports/correctness.json \
            | tee ../../audit/reports/correctness.txt
          echo "correctness_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # ── Download current published release ──
      - name: Download current published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest data-* release
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --json tagName --jq '[.[] | .tagName | select(startswith("data-"))][0]')

          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No published data-* release found. Cannot perform comparison."
            echo "This workflow requires at least one published release to compare against."
            exit 1
          fi

          echo "Downloading published release: $LATEST_TAG"
          gh release download "$LATEST_TAG" --repo ${{ github.repository }} --pattern "insider_signals.db.xz" --dir audit/
          xz -d audit/insider_signals.db.xz
          mv audit/insider_signals.db audit/published.db

          echo "Published DB:"
          ls -lh audit/published.db
          echo "PUBLISHED_TAG=$LATEST_TAG" >> $GITHUB_ENV

      # ── Compare artifacts ──
      - name: Compare rebuilt vs published
        id: compare
        timeout-minutes: 10
        continue-on-error: true
        run: |
          mkdir -p audit/reports
          cd packages/tracker

          # Steps run with bash -e: without this a failure would stop the step
          # before its exit code is recorded, and the evaluation would pass.
          set +e
          python pipeline/compare_artifacts.py \
            ../../audit/published.db \
            ../../audit/rebuilt.db \
            --output ../../audit/reports/comparison.txt \
            --json ../../audit/reports/comparison.json

          COMPARE_EXIT=$?
          echo "comparison_exit_code=$COMPARE_EXIT" >> $GITHUB_OUTPUT

          echo "Comparison complete (exit code: $COMPARE_EXIT)"
          echo ""
          echo "=== COMPARISON SUMMARY ==="
          cat ../../audit/reports/comparison.txt | tail -20

      # ── Validate rebuilt DB ──
      - name: Validate rebuilt DB against contract
        timeout-minutes: 5
        continue-on-error: true
        run: |
          cd packages/tracker
          mkdir -p ../../audit/reports

          set +e
          python -m tracker.pipeline.validate \
            --db ../../audit/rebuilt.db \
            --json-report ../../audit/reports/validation.json \
            --verbose | tee ../../audit/reports/validation.txt
          VALIDATE_EXIT=${PIPESTATUS[0]}
          echo "VALIDATION_EXIT_CODE=$VALIDATE_EXIT" >> $GITHUB_ENV

          echo ""
          echo "=== VALIDATION SUMMARY ==="
          cat ../../audit/reports/validation.txt | tail -20

      # ── Upload reports ──
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-audit-reports
          path: audit/reports/
          retention-days: 180

      # ── Check results and fail if needed ──
      - name: Evaluate audit results
        if: always()
        run: |
          echo "=== AUDIT RESULTS ==="
          echo "Published release: $PUBLISHED_TAG"
          echo "Correctness exit code: ${{ steps.correctness.outputs.correctness_exit_code }}"
          echo "Comparison exit code: ${{ steps.compare.outputs.comparison_exit_code }}"
          echo "Validation exit code: $VALIDATION_EXIT_CODE"
          echo ""

          FAILURES=""

          # Check the data against SEC
          case "${{ steps.correctness.outputs.correctness_exit_code }}" in
            0) ;;
            1) FAILURES="${FAILURES}- CORRECTNESS AUDIT FAILED (rebuilt data disagrees with SEC; see correctness.txt)\n" ;;
            *) FAILURES="${FAILURES}- CORRECTNESS AUDIT DID NOT RUN OR CRASHED\n" ;;
          esac

          # Check comparison
          if [ "${{ steps.compare.outputs.comparison_exit_code }}" = "1" ]; then
            FAILURES="${FAILURES}- SUSPICIOUS DIFFERENCES detected between rebuilt and published artifacts\n"
          elif [ "${{ steps.compare.outputs.comparison_exit_code }}" = "2" ]; then
            FAILURES="${FAILURES}- COMPARISON FAILED (error during comparison)\n"
          fi

          if [ -z "${{ steps.compare.outputs.comparison_exit_code }}" ]; then
            FAILURES="${FAILURES}- COMPARISON DID NOT RUN\n"
          fi

          # Check validation
          if [ -z "$VALIDATION_EXIT_CODE" ]; then
            FAILURES="${FAILURES}- VALIDATION DID NOT RUN\n"
          elif [ "$VALIDATION_EXIT_CODE" = "1" ]; then
            FAILURES="${FAILURES}- VALIDATION FAILED (rebuilt DB violates data contract)\n"
          elif [ "$VALIDATION_EXIT_CODE" = "2" ]; then
            FAILURES="${FAILURES}- VALIDATION ERROR (error during validation)\n"
          fi

          if [ -n "$FAILURES" ]; then
            echo "::error::Rebuild audit FAILED:"
            echo -e "$FAILURES"
            echo ""
            echo "Review the audit reports artifact for details."
            echo "This indicates one or more of:"
            echo "  - The rebuilt data disagrees with SEC's filings or company reports"
            echo "  - The incremental path has drifted from the full rebuild"
            echo "  - The full rebuild path is broken and cannot produce a valid artifact"
            echo ""
            echo "DO NOT merge changes that break this audit without investigation."
            exit 1
          else
            echo "✅ Rebuild audit PASSED"
            echo "The rebuilt data matches SEC on every check, and is consistent with"
            echo "the incremental updates. No suspicious drift detected."
          fi
