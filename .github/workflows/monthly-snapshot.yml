name: Monthly DB snapshot

# Runs monthly to refresh the insider-signals SQLite DB and publish it as a
# GitHub Release asset. The MCPB install script pulls the latest release
# tagged `data-YYYY-MM`.
#
# Default mode is INCREMENTAL: downloads the previous month's DB from the
# latest release, runs refresh.py to ingest only new Form 4 filings + recompute
# scores, then publishes a new release. This is much cheaper (~5-10 min) than
# a from-scratch rebuild and avoids re-fetching ~1.8M Form 4s every month.
#
# `force_full_rebuild: true` on manual dispatch falls back to the slow path
# (run_expanded_pipeline.py, ~45-60 min) for cases where the prior DB is
# corrupted or the schema changed.

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Optional suffix appended to the release tag (e.g. -hotfix)."
        required: false
        default: ""
      force_full_rebuild:
        description: "Rebuild the DB from scratch instead of incremental refresh."
        type: boolean
        required: false
        default: false
      backfill_current_quarter:
        description: "Backfill the current quarter's Form 4 filings for the full universe via live XML (slow, ~1-2h)."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONUNBUFFERED: "1"
    # Step ordering enforces data dependencies:
    #   seed/refresh -> dedup migration -> current-quarter Form 4s -> ticker fix
    #   -> prices (needs correct tickers) -> benchmark ETFs -> shares outstanding
    #   -> market cap (Phase 2.7 in refresh.py) -> scoring
    #   -> historical backtest (needs prices + benchmarks) -> frozen export (needs hit rates)
    #   -> VALIDATE -> compress -> publish
    # NOTE: Market cap computation happens early (Phase 2.7 in refresh.py), but prices are
    #       refreshed later. If this ordering causes stale market caps, Phase 2.7 needs to move.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ── Path A: incremental (default) ──
      - name: Seed DB from previous release (incremental mode)
        if: ${{ github.event.inputs.force_full_rebuild != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data packages/tracker/db
          # Find the latest release whose tag starts with data-
          PREV_TAG=$(gh release list --repo ${{ github.repository }} --json tagName --jq '[.[] | .tagName | select(startswith("data-"))][0]')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous data-* release found; falling back to fresh init"
            python packages/tracker/db/init_db.py
            cp packages/tracker/db/insider_signals.db data/insider_signals.db
          else
            echo "Seeding from previous release: $PREV_TAG"
            gh release download "$PREV_TAG" --repo ${{ github.repository }} --pattern "insider_signals.db.xz" --dir data/
            xz -d data/insider_signals.db.xz
            # tracker code reads from packages/tracker/db/; mirror it there
            cp data/insider_signals.db packages/tracker/db/insider_signals.db
            echo "Seeded DB size:"
            ls -lh data/insider_signals.db packages/tracker/db/insider_signals.db
          fi

      - name: Migrate transaction dedup constraint
        if: ${{ github.event.inputs.force_full_rebuild != 'true' }}
        timeout-minutes: 15
        run: |
          cd packages/tracker
          python migrate_txn_dedup.py

      - name: Run incremental refresh (~5-15 min)
        if: ${{ github.event.inputs.force_full_rebuild != 'true' }}
        timeout-minutes: 60
        run: |
          cd packages/tracker
          python refresh.py --expanded --skip-sectors

      # ── Path B: full rebuild (only if force_full_rebuild=true) ──
      - name: Initialize empty DB schema (full rebuild mode)
        if: ${{ github.event.inputs.force_full_rebuild == 'true' }}
        run: |
          mkdir -p data packages/tracker/db
          python packages/tracker/db/init_db.py
          cp packages/tracker/db/insider_signals.db data/insider_signals.db

      - name: Run full pipeline (~45-60 min)
        if: ${{ github.event.inputs.force_full_rebuild == 'true' }}
        timeout-minutes: 90
        run: |
          cd packages/tracker
          python run_expanded_pipeline.py

      # ── Common: backfill, backtest, sync, compress, publish ──
      - name: Backfill current quarter if data volume is incomplete
        if: ${{ github.event.inputs.force_full_rebuild != 'true' }}
        timeout-minutes: 120
        continue-on-error: true
        run: |
          cd packages/tracker

          # Determine the most recent complete month (ended at least 5 days ago)
          # to avoid evaluating partial months where Form 4s are still trickling in.
          EVAL_MONTH=$(python3 -c "
          from datetime import datetime, timedelta
          today = datetime.now()
          # Last day of previous month
          first_of_this_month = datetime(today.year, today.month, 1)
          last_month_end = first_of_this_month - timedelta(days=1)

          if (today - last_month_end).days >= 5:
              print(f'{last_month_end.year:04d}-{last_month_end.month:02d}')
          else:
              # Too close to month boundary, go back one more month
              first_of_last_month = datetime(last_month_end.year, last_month_end.month, 1)
              two_months_ago_end = first_of_last_month - timedelta(days=1)
              print(f'{two_months_ago_end.year:04d}-{two_months_ago_end.month:02d}')
          ")

          TARGET_YEAR="${EVAL_MONTH%-*}"
          TARGET_MONTH="${EVAL_MONTH#*-}"
          echo "Evaluating completeness for $TARGET_YEAR-$TARGET_MONTH"

          # Get transaction count for target month in current year
          CURRENT_COUNT=$(sqlite3 db/insider_signals.db "
            SELECT COUNT(*) FROM insider_transactions
            WHERE strftime('%Y', transaction_date) = '$TARGET_YEAR'
              AND strftime('%m', transaction_date) = '$TARGET_MONTH'
              AND transaction_date GLOB '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
          ")

          # Get counts for same calendar month in prior 3 years (for robust baseline)
          PRIOR_YEAR_1=$((TARGET_YEAR - 1))
          PRIOR_YEAR_2=$((TARGET_YEAR - 2))
          PRIOR_YEAR_3=$((TARGET_YEAR - 3))

          PRIOR_COUNTS=$(sqlite3 db/insider_signals.db "
            SELECT strftime('%Y', transaction_date) as year, COUNT(*) as cnt
            FROM insider_transactions
            WHERE strftime('%m', transaction_date) = '$TARGET_MONTH'
              AND transaction_date GLOB '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
              AND strftime('%Y', transaction_date) IN ('$PRIOR_YEAR_1', '$PRIOR_YEAR_2', '$PRIOR_YEAR_3')
            GROUP BY year
            ORDER BY year
          ")

          echo "Current count: $CURRENT_COUNT"
          echo "Prior years for month $TARGET_MONTH:"
          echo "$PRIOR_COUNTS"

          # Calculate median of prior years as baseline
          BASELINE=$(python3 -c "
          import sys
          counts = [int(line.split('|')[1]) for line in '''$PRIOR_COUNTS'''.strip().split('\n') if line]
          if not counts:
              print(0)
          else:
              counts.sort()
              median = counts[len(counts)//2]
              print(median)
          ")

          echo "Baseline (median of prior years): $BASELINE"

          # Apply 70% completeness threshold: catches severely incomplete quarters
          # (pre-backfill was 25%) while avoiding false positives on normal variance.
          if [ "$BASELINE" -eq 0 ]; then
            echo "No baseline data available, running backfill as a precaution"
            python backfill_quarter_index.py
          else
            THRESHOLD=70
            PERCENTAGE=$(python3 -c "print(int(100 * $CURRENT_COUNT / $BASELINE))")
            echo "Current month is at $PERCENTAGE% of baseline (threshold: $THRESHOLD%)"

            if [ "$PERCENTAGE" -lt "$THRESHOLD" ]; then
              echo "Data volume incomplete ($PERCENTAGE% < $THRESHOLD%), running current-quarter backfill"
              python backfill_quarter_index.py
            else
              echo "Data volume complete ($PERCENTAGE% >= $THRESHOLD%), skipping backfill"
            fi
          fi

      - name: Backfill current quarter (manual force, full universe)
        if: ${{ github.event.inputs.force_full_rebuild != 'true' && github.event.inputs.backfill_current_quarter == 'true' }}
        timeout-minutes: 90
        continue-on-error: true
        run: |
          cd packages/tracker
          python backfill_quarter_index.py

      - name: Fix ticker symbols
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/fix_ticker_symbols.py --write

      - name: Backfill pre-2021 prices
        timeout-minutes: 60
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/backfill_prices.py

      - name: Fetch benchmark ETF prices
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/fetch_benchmark_etfs.py

      - name: Backfill shares outstanding
        timeout-minutes: 90
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/backfill_shares_outstanding.py --write

      - name: Recompute market caps
        timeout-minutes: 5
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/recompute_market_caps.py --write

      - name: Run historical backtest
        timeout-minutes: 30
        continue-on-error: true
        run: |
          cd packages/tracker
          python backtest/historical_backtest.py

      - name: Export frozen insider snapshot
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd packages/tracker
          python scripts/export_frozen_insider.py

      - name: Validate data contract
        timeout-minutes: 5
        run: |
          cd packages/tracker
          mkdir -p validation_reports
          # Pipefail ensures tee does not mask the validator's exit code.
          # Without this, a CRITICAL failure would exit 1 but the step would
          # succeed (tee always returns 0), and publication would proceed.
          set -o pipefail
          python -m tracker.pipeline.validate \
            --json-report validation_reports/validation.json \
            --verbose | tee validation_reports/validation.txt

      - name: Upload validation report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: packages/tracker/validation_reports/
          retention-days: 90

      - name: Sync data/ from tracker output
        run: |
          cp packages/tracker/db/insider_signals.db data/insider_signals.db
          if [ -f packages/tracker/output/latest_signals.csv ]; then
            cp packages/tracker/output/latest_signals.csv data/latest_signals.csv
          fi
          if [ -f packages/tracker/output/historical_clusters.csv ]; then
            cp packages/tracker/output/historical_clusters.csv data/historical_clusters.csv
          fi
          if [ -f packages/tracker/output/insider_frozen.json.gz ]; then
            cp packages/tracker/output/insider_frozen.json.gz data/insider_frozen.json.gz
          fi
          if [ -f packages/tracker/validation_reports/validation.json ]; then
            cp packages/tracker/validation_reports/validation.json data/validation.json
          fi
          if [ -f packages/tracker/validation_reports/validation.txt ]; then
            cp packages/tracker/validation_reports/validation.txt data/validation.txt
          fi

      - name: Compress DB
        run: |
          # xz -9 -T0 (multi-threaded) takes ~1 min for ~900MB → ~98MB.
          xz -9 -T0 -k data/insider_signals.db
          ls -lh data/

      - name: Generate SHA256SUMS
        run: |
          cd data
          # Generate checksums for all release assets (basenames only, two spaces between hash and filename)
          sha256sum insider_signals.db.xz latest_signals.csv > SHA256SUMS
          if [ -f historical_clusters.csv ]; then
            sha256sum historical_clusters.csv >> SHA256SUMS
          fi
          if [ -f insider_frozen.json.gz ]; then
            sha256sum insider_frozen.json.gz >> SHA256SUMS
          fi
          if [ -f validation.json ]; then
            sha256sum validation.json >> SHA256SUMS
          fi
          if [ -f validation.txt ]; then
            sha256sum validation.txt >> SHA256SUMS
          fi
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Compute release tag
        id: tag
        run: |
          SUFFIX="${{ github.event.inputs.tag_suffix }}"
          echo "tag=data-$(date -u +%Y-%m)${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="incremental"
          if [ "${{ github.event.inputs.force_full_rebuild }}" = "true" ]; then
            MODE="full rebuild"
          fi

          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="Monthly DB snapshot — $TAG"
          NOTES="Pre-built insider-transactions + shares-outstanding SQLite DB plus the latest signal scanner CSV, historical hit rate clusters, frozen insider snapshot, and validation report. Generated automatically by the monthly-snapshot workflow ($MODE mode). SHA256SUMS provided for integrity verification."

          ASSETS="data/insider_signals.db.xz data/latest_signals.csv data/SHA256SUMS"
          if [ -f data/historical_clusters.csv ]; then
            ASSETS="$ASSETS data/historical_clusters.csv"
          fi
          if [ -f data/insider_frozen.json.gz ]; then
            ASSETS="$ASSETS data/insider_frozen.json.gz"
          fi
          # Skip validation reports if missing or zero-byte (GitHub rejects empty uploads).
          # This makes publication resilient to buffering/output issues, but validation
          # failure still blocks this step from running at all (no continue-on-error).
          if [ -f data/validation.json ] && [ -s data/validation.json ]; then
            ASSETS="$ASSETS data/validation.json"
          fi
          if [ -f data/validation.txt ] && [ -s data/validation.txt ]; then
            ASSETS="$ASSETS data/validation.txt"
          fi

          # Check if release already exists
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets with --clobber"
            gh release upload "$TAG" $ASSETS \
              --repo ${{ github.repository }} \
              --clobber
            gh release edit "$TAG" \
              --repo ${{ github.repository }} \
              --notes "$NOTES"
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" \
              $ASSETS \
              --repo ${{ github.repository }} \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
